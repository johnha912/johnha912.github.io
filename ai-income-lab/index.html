let lang='en', side='muse';
function setLang(l){lang=l;document.getElementById('btn-en').classList.toggle('on',l==='en');document.getElementById('btn-vi').classList.toggle('on',l==='vi');document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[l]);render();}
function setSide(s){side=s;document.getElementById('side-muse').classList.toggle('on',s==='muse');document.getElementById('side-claude').classList.toggle('on',s==='claude');render();}
function render(){const t=T[lang], d=SIDES[side];
 // Each side may ship its own pool + note in its JSON; only the Muse view falls back to the built-in POOL.
 const sidePool=Array.isArray(d.pool)?d.pool.map(p=>[p.en,p.vi,p.market,p.score]):(side==='muse'?POOL:[]);
 const nIdeas=sidePool.length||d.scored||0, poolTake=(d.poolNote&&d.poolNote[lang])||(sidePool.length?t.poolTake:t.noPool);
 const daysLeft=Math.max(0,Math.ceil((Date.UTC(2026,11,25,8)-Date.now())/864e5));
 document.getElementById('hero').innerHTML=`<div class="hero"><div class="hero-in">
  <div class="kicker">${t.kick}</div><h1>${t.h1}</h1><p>${t.tag}</p>
  <div class="stats"><div class="stat"><div class="num mono">${String(nIdeas).padStart(2,"0")}</div><div class="lbl">${t.s1}</div></div>
  <div class="stat"><div class="num mono">04</div><div class="lbl">${t.s2}</div></div>
  <div class="stat"><div class="num mono">${daysLeft}</div><div class="lbl">${t.s3}</div></div></div></div></div>`;
 document.getElementById('sideband').innerHTML=`<span class="who">${t.viewing}: ${side==='muse'?'MUSE':'CLAUDE CODE'}</span>
  <span class="muted">${d.status[lang]}</span>${d.updated?`<span class="mono muted">${t.updated}: ${d.updated}</span>`:''}`;
 const gates=[t.g1,t.g2,t.g3,t.g4].map((g,i)=>`<div class="gate"><div class="n mono">0${i+1}</div><div>${g}</div></div>`).join('');
 const rubric=RUBRIC.map(r=>`<div class="bar-row"><div class="lbl">${lang==='en'?r[0]:r[2]}</div><div class="track"><div class="fill" style="width:${r[1]*5}%"></div></div><div class="pts mono">${r[1]}</div></div>`).join('');
 const pool=sidePool.map((p,i)=>`<tr><td class="idx mono">${String(i+1).padStart(2,'0')}</td><td>${lang==='en'?p[0]:p[1]}</td><td class="c3">${p[2]}</td><td class="mono">${p[3]==null?"—":p[3]}</td></tr>`).join('');
 const log=d.log.length?d.log.map(x=>`<div class="logline"><div class="t mono">${x.t}</div><div>${x[lang]||x.en}</div></div>`).join(''):`<p class="muted">${t.noLog}</p>`;
 const upd=d.updates.length?d.updates.map(x=>`<div class="logline"><div class="t mono">${x.t}</div><div>${x[lang]||x.en}</div></div>`).join(''):`<p class="muted">${t.noUpd}</p>`;
 document.getElementById('app').innerHTML=`
 <section><div class="kicker">${t.gates}</div><h2>${t.gates}</h2><p class="take">${t.gTake}</p>${gates}</section>
 <section><div class="kicker">Rubric</div><h2>${t.rub}</h2><p class="take">${t.rubTake}</p>${rubric}
 <h2 style="margin-top:26px">${t.best} — ${side==='muse'?'Muse':'Claude Code'}</h2><p class="muted">${d.best?('<span class="mono" style="font-size:1.6rem;color:#0a0a0a;font-weight:700">'+d.best+' / 100</span>'):t.bestNone}</p></section>
 <section><div class="kicker">Pool v1</div><h2>${t.pool}</h2><p class="take">${poolTake}</p>
 ${sidePool.length?`<table><tr><th>#</th><th>${t.th1}</th><th class="c3">${t.th2}</th><th>Score</th></tr>${pool}</table>`:""}</section>
 <section><div class="kicker">Log</div><h2>${t.prog}</h2>${log}<p class="note" style="margin-top:14px">${t.next}</p></section>
 <section><div class="kicker">Platform</div><h2>${t.upd}</h2>${upd}</section>
 <section><div class="kicker">Feedback</div><h2>${t.fb}</h2><p class="take">${t.fbTake}</p>
 <label>${t.fSide}<select id="fb-side"><option value="Claude"${side==='claude'?' selected':''}>CLAUDE</option><option value="Muse"${side==='muse'?' selected':''}>MUSE</option><option value="Both">${t.fBoth}</option></select></label>
 <label>${t.fType}<select id="fb-type"><option>${t.fIdea}</option><option>${t.fNew}</option><option>${t.fVote}</option></select></label>
 <label>${t.fMsg}<textarea id="fb-msg" rows="4"></textarea></label>
 <button class="send" onclick="openIssue()">${t.fSend} ↗</button><p class="note">${t.fNote} <a href="${ISSUES}?q=is%3Aissue+%22AI+Income+Lab%22" target="_blank" rel="noopener">${t.fAll} ↗</a></p></section>`;
 }
// Feedback becomes a public, timestamped GitHub issue so every note leaves a written record.
const ISSUES='https://github.com/johnha912/johnha912.github.io/issues';
function openIssue(){const sd=document.getElementById('fb-side').value,ty=document.getElementById('fb-type').value,msg=document.getElementById('fb-msg').value.trim();
 const title='[AI Income Lab]['+sd+'] '+ty, body=(msg||'')+'\n\n---\nSent from the AI Income Lab page ('+lang.toUpperCase()+').';
 window.open(ISSUES+'/new?title='+encodeURIComponent(title)+'&body='+encodeURIComponent(body),'_blank','noopener');}
setLang('en'); loadSide('muse'); loadSide('claude');
</script>
