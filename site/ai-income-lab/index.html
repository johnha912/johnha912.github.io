function renderBand(){const t=T[lang],d=SIDES[side];
 document.getElementById('sideband').innerHTML=`<span class="who">${t.viewing}: ${side==='muse'?'MUSE':'CLAUDE CODE'}</span>${nowChip(d.now,t)}
  <span class="muted">${d.status[lang]}</span>${d.updated?`<span class="mono muted">${t.updated}: ${d.updated}</span>`:''}`;}
// Every 60 s: re-read both data files. Redraw only if something changed, and keep anything typed in the feedback form.
async function refresh(){const before=JSON.stringify(SIDES);
 await Promise.all(['muse','claude'].map(n=>loadSide(n,true)));
 if(JSON.stringify(SIDES)===before){renderBand();return;}
 const keep=['fb-side','fb-type','fb-msg'].map(id=>{const e=document.getElementById(id);return e?[id,e.value]:null;}).filter(Boolean);
 render(); keep.forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.value=v;});}
// Theme (remembered per viewer) and the back-to-top button. The bottom dock always stays open.
function setTheme(m){document.documentElement.dataset.theme=m;try{localStorage.setItem('lab-theme',m)}catch(e){}
 document.getElementById('theme-light').classList.toggle('on',m==='light');document.getElementById('theme-dark').classList.toggle('on',m==='dark');}
function initChrome(){const top=document.getElementById('totop');
 setTheme(document.documentElement.dataset.theme==='light'?'light':'dark');
 const onScroll=()=>top.classList.toggle('show',window.scrollY>600);window.addEventListener('scroll',onScroll,{passive:true});onScroll();}
setLang('en'); loadSide('muse'); loadSide('claude'); initChrome();
if(typeof window.setInterval==='function') window.setInterval(refresh,60000);
</script>
